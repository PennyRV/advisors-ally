[theme]
base = "light"
primaryColor = "#245C50"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#E8ECEA"
textColor = "#292D2B"
borderColor = "#AAB5AF"

font = "Aptos, sans-serif"
baseFontSize = 16
headingFontSizes = ["2.25rem", "1.625rem", "1.25rem"]
headingFontWeights = [600, 600, 600]

baseRadius = "0.5rem"
buttonRadius = "0.75rem"

[theme.sidebar]
backgroundColor = "#DCE3DF"
secondaryBackgroundColor = "#EDF1EF"
textColor = "#292D2B"
primaryColor = "#245C50"
borderColor = "#AAB5AF"
